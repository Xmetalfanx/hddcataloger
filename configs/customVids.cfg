
####################################################################
# Meta function to check for the root level "/videos" directiory
function check_for_custom_video_dir() {

    create_header "Checking for custom videos /videos directory"

    # check for vids dir (/videos, in the root location) first, if it doesn't exist, there is no need to proceed
    if [ -d "$custom_vids_dir" ]; then

        # not sure if i need these two but leave them for now
        sectionTitle="videos"
        
        dirLevel="customVids"

        for each_custom_vid_dir in "${custom_vid_dirs[@]}"
        do
            each_custom_vid_dir="$custom_vids_dir/$each_custom_vid_dir"
            each_custom_vid_main_catagory=$(basename "${each_custom_vid_dir}" )

            each_custom_vid_output_file="$driveLabel"_"$currentDate"_"${each_custom_vid_main_catagory}_Catalog.txt"

            # ** example
            ##   currentsubDirOutputFile="$driveLabel"_"$currentDate"_"$sectionTitle"_"$subDir"_Summary.txt

            [ -d "${each_custom_vid_dir}" ] && {
                echo -e "${each_custom_vid_main_catagory} directory DOES EXIST"
                tree \
                    -I "$(IFS='|'; echo "${TREE_IGNORE_PATTERNS[*]}")" "${each_custom_vid_dir}" \
                    -o "${each_custom_vid_output_file}"
            } || {
                echo -e "${each_custom_vid_main_catagory} directory doesn't exist"
                return
            }


        done

    ## this doesn't make sense here .... this should be (I think) sort of inside "checkForSpecificSubDirs"
    elif [ ! -d "${custom_vids_dir}" ]; then
        echo -e "videos directory not detected" && sleep 2

    else
        echo -e "Error detecting videos directory, on $driveLabel"
    fi
}
