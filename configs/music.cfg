# Meta function
function main_music_genre_check() {

    # ONLY checks the subdirs existing IF the root (/Rock for example) exist or otherwise there is no point
    [ -d $music_others_dir ] && music_root_dir_check ${music_others_dir} && music_sub_dir_check "${others_sub_dirs[@]}" "$eachMainDir"

    [ -d $music_rock_dir ] && music_root_dir_check $music_rock_dir && music_sub_dir_check "${music_rock_dir[@]}" "$eachMainDir"
}

music_rock_dir="$main_music_dir/Rock"
