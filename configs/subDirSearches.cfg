#################################################################
# Main/root level

function christmas_sub_dir_search() {

    # here we know "christmasRelated" exists

    sectionTitle="christmas_related"
    subDirSearch=("music" "movies" "OTR" "videos")
    dirLevel="root"

    universal_subdir_check "${subDirSearch[@]}" "$sectionTitle"
}

# The Great Courses/"The Teaching Company"
function tgc_sub_dir_search() {
    sectionTitle="The_Great_Course"

    ## idea: does it make more sense to split tgc into audio and video?
    # OR to have the course names (some i have audio AND video) and then in there an "audio" and "video"
    # set of dirs?

    subDirSearch=("audio" "video")
    dirLevel="customVids"

    universal_subdir_check "${subDirSearch[@]}" "$sectionTitle"

}


# end main/root level
