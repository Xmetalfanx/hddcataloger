# this needs to be moved elsewhere 
function create_header() {
    
    # this is the text in say the menu surrounded by the border
    local border_text=${@}
    
    local border_char="-"
    local border_width="${#border_text}"
    local border=$(printf '%*s' "$border_width" "" | tr ' ' "$border_char")
    
    clear
    echo -e "${border}"
    echo -e "${border_text}"
    echo -e "${border}\v"

}