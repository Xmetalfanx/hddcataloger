
function loading_configs() {
    config_file="$PWD/configs/$1"

    [ ! -f "$config_file" ] && echo -e "$config_file does not exist" && return

    echo -e "Loading $config_file"
    . $config_file
}

loading_configs "cataloging.cfg"
loading_configs "customVids.cfg"
loading_configs "music.cfg"
loading_configs "subDirSearches.cfg"
loading_configs "universal.cfg"
loading_configs "variables.cfg"
